[project]
name = "mapforge"
version = "0.1.0"
description = "Self-hosted web tool to fetch, bound and convert aeronautical charts, imagery and elevation into map-engine-ready packages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "mapforge/static/vendor/leaflet/LICENSE"]
dependencies = [
  "rasterio>=1.4",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mapforge = "mapforge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mapforge*"]

[tool.setuptools.package-data]
mapforge = ["static/**/*"]

[tool.pytest.ini_options]
# Import the checkout under test, not whatever copy the venv has installed (editable installs
# point at one checkout; worktrees and CI would otherwise silently test that one).
pythonpath = ["."]
